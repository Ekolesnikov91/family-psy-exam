<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Экзамен — Психология семейных отношений</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 40px 36px;
    width: 100%;
    max-width: 640px;
  }
  h1 {
    font-size: 1.5rem;
    color: #1a1a2e;
    margin-bottom: 6px;
    line-height: 1.3;
  }
  .subtitle {
    color: #6b7280;
    font-size: 0.95rem;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 0.9rem;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input[type="text"], input[type="email"] {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #d1d5db;
    border-radius: 10px;
    font-size: 1rem;
    color: #1a1a2e;
    transition: border-color 0.2s;
    outline: none;
  }
  input:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: #6366f1;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 28px;
    transition: background 0.2s, transform 0.1s;
  }
  .btn:hover { background: #4f46e5; }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { background: #a5b4fc; cursor: not-allowed; }

  /* Progress */
  .progress-wrap { margin-bottom: 24px; }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: #6b7280;
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 6px;
    background: #e5e7eb;
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #6366f1, #8b5cf6);
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  /* Question */
  .question-num {
    font-size: 0.82rem;
    font-weight: 700;
    color: #6366f1;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }
  .question-text {
    font-size: 1.07rem;
    color: #1a1a2e;
    line-height: 1.6;
    margin-bottom: 22px;
    font-weight: 500;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 16px;
    border: 1.5px solid #e5e7eb;
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    user-select: none;
  }
  .option:hover { border-color: #6366f1; background: #f5f3ff; }
  .option.selected { border-color: #6366f1; background: #eef2ff; }
  .option-letter {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #e5e7eb;
    color: #374151;
    font-size: 0.82rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .option.selected .option-letter { background: #6366f1; color: #fff; }
  .option-text { font-size: 0.97rem; color: #374151; line-height: 1.45; padding-top: 3px; }

  .nav-row {
    display: flex;
    gap: 12px;
    margin-top: 28px;
  }
  .btn-secondary {
    flex: 1;
    padding: 13px;
    background: #f3f4f6;
    color: #374151;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-secondary:hover { background: #e5e7eb; }
  .btn-primary {
    flex: 2;
    padding: 13px;
    background: #6366f1;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: #4f46e5; }
  .btn-primary:disabled { background: #a5b4fc; cursor: not-allowed; }

  /* Results */
  .result-grade {
    text-align: center;
    padding: 32px 0 20px;
  }
  .grade-circle {
    width: 100px; height: 100px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    font-size: 2.8rem;
    font-weight: 800;
    color: #fff;
  }
  .grade-5 { background: linear-gradient(135deg, #10b981, #059669); }
  .grade-4 { background: linear-gradient(135deg, #6366f1, #4f46e5); }
  .grade-3 { background: linear-gradient(135deg, #f59e0b, #d97706); }
  .grade-fail { background: linear-gradient(135deg, #ef4444, #dc2626); }
  .grade-label { font-size: 1.3rem; font-weight: 700; color: #1a1a2e; margin-bottom: 6px; }
  .grade-sub { font-size: 0.95rem; color: #6b7280; }
  .score-bar-wrap { margin: 24px 0; }
  .score-bar {
    height: 10px;
    background: #e5e7eb;
    border-radius: 99px;
    overflow: hidden;
    margin-top: 8px;
  }
  .score-bar-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 1s ease;
  }
  .score-text { font-size: 0.9rem; color: #6b7280; display: flex; justify-content: space-between; }
  .sending-msg { text-align: center; color: #6b7280; font-size: 0.9rem; margin-top: 16px; }
  .sent-ok { color: #10b981; font-weight: 600; }
  .sent-err { color: #ef4444; }

  /* Greeting */
  .result-greeting {
    font-size: 1rem;
    color: #374151;
    text-align: center;
    margin-bottom: 4px;
    line-height: 1.5;
  }
  .result-greeting strong { color: #1a1a2e; }

  /* Answer chart */
  .chart-wrap { margin: 28px 0 8px; }
  .chart-title { font-size: 0.85rem; font-weight: 600; color: #6b7280; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  .chart-grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 5px;
  }
  .chart-cell {
    aspect-ratio: 1;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 700;
    color: #fff;
  }
  .chart-cell.correct { background: #10b981; }
  .chart-cell.wrong   { background: #ef4444; }
  .chart-legend {
    display: flex;
    gap: 20px;
    margin-top: 10px;
    font-size: 0.82rem;
    color: #6b7280;
  }
  .legend-dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 3px;
    margin-right: 5px;
    vertical-align: middle;
  }

  .hidden { display: none !important; }

  @media (max-width: 480px) {
    .card { padding: 28px 20px; }
    h1 { font-size: 1.25rem; }
  }
</style>
</head>
<body>
<div class="card">

  <!-- SCREEN 1: Registration -->
  <div id="screen-reg">
    <h1>Экзамен</h1>
    <p class="subtitle">Психология семейных отношений и консультирование семьи</p>

    <label for="reg-name">Фамилия Имя Отчество</label>
    <input type="text" id="reg-name" placeholder="Иванова Мария Ивановна" autocomplete="name">

    <label for="reg-group">Группа</label>
    <input type="text" id="reg-group" placeholder="Группа 1">

    <label for="reg-email">Email (для получения результата)</label>
    <input type="email" id="reg-email" placeholder="example@mail.ru" autocomplete="email">

    <button class="btn" id="btn-start" onclick="startExam()">Начать экзамен →</button>
  </div>

  <!-- SCREEN 2: Question -->
  <div id="screen-q" class="hidden">
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="q-counter">Вопрос 1 из 30</span>
        <span id="q-score-live"></span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:3.3%"></div>
      </div>
    </div>
    <div class="question-num" id="q-num">Вопрос 1</div>
    <div class="question-text" id="q-text"></div>
    <div class="options" id="q-options"></div>
    <div class="nav-row">
      <button class="btn-secondary" id="btn-prev" onclick="prevQ()">← Назад</button>
      <button class="btn-primary" id="btn-next" onclick="nextQ()" disabled>Далее →</button>
    </div>
  </div>

  <!-- SCREEN 3: Results -->
  <div id="screen-result" class="hidden">
    <p class="result-greeting" id="result-greeting"></p>
    <div class="result-grade">
      <div class="grade-circle" id="grade-circle">5</div>
      <div class="grade-label" id="grade-label">Отлично</div>
      <div class="grade-sub" id="grade-sub">Поздравляем!</div>
    </div>
    <div class="score-bar-wrap">
      <div class="score-text">
        <span>Правильных ответов</span>
        <span id="score-text-right">0 / 30</span>
      </div>
      <div class="score-bar">
        <div class="score-bar-fill" id="score-bar-fill" style="width:0%"></div>
      </div>
    </div>

    <!-- Answer chart -->
    <div class="chart-wrap">
      <div class="chart-title">Ответы по вопросам</div>
      <div class="chart-grid" id="chart-grid"></div>
      <div class="chart-legend">
        <span><span class="legend-dot" style="background:#10b981"></span>Верно</span>
        <span><span class="legend-dot" style="background:#ef4444"></span>Ошибка</span>
      </div>
    </div>

    <div class="sending-msg" id="sending-msg">Отправляем результаты…</div>
  </div>

</div>

<script>
// Распределение правильных ответов: а=8, б=7, в=7, г=8
const QUESTIONS = [
  // --- ПАРА 1 ---
  {
    // Q1 → а
    text: "Какую функцию семьи описывает следующее: семья передаёт ребёнку нормы, ценности и правила поведения в обществе?",
    opts: [
      "Функцию социализации",
      "Экономическую",
      "Статусную",
      "Функцию эмоциональной поддержки"
    ],
    ans: 0
  },
  {
    // Q2 → г
    text: "Клиентка пришла одна — «муж не хочет идти к психологу». Консультант начинает работать только с её версией ситуации и постепенно начинает видеть мужа её глазами. Как называется эта профессиональная ловушка?",
    opts: [
      "Спасатель — берёт на себя ответственность за решение",
      "Друг — нарушает профессиональную дистанцию",
      "Судья — задаёт вопросы, которые фактически обвиняют одного из партнёров",
      "Союзник одного — видит ситуацию только с одной стороны, теряет стереоскопичность"
    ],
    ans: 3
  },
  {
    // Q3 → б
    text: "Треугольник Карпмана описывает три роли, в которые может попасть консультант. Какие это роли?",
    opts: [
      "Родитель, Взрослый, Ребёнок",
      "Жертва, Спасатель, Преследователь",
      "Эксперт, Наблюдатель, Модератор",
      "Союзник, Судья, Терапевт"
    ],
    ans: 1
  },
  {
    // Q4 → в
    text: "Пара пришла на консультацию. Муж: «Я работаю на двух работах». Жена: «Его нет дома, а когда есть — в телефоне». Консультант внутри себя уже решил, кто прав, и задаёт «уточняющие» вопросы, которые фактически обвиняют одного из партнёров. К чему это приводит?",
    opts: [
      "Консультант теряет теоретическую точность в постановке гипотезы",
      "Консультация переходит в психотерапию",
      "Рабочий альянс разрушается: один клиент чувствует безопасность, другой — давление",
      "Консультант нарушает границу между консультированием и психиатрией"
    ],
    ans: 2
  },
  {
    // Q5 → г (без изменений)
    text: "Консультант только что прочитал про циркулярную модель Олсона и начинает объяснять клиентам их ситуацию на языке теории: «У вас запутанная, слившаяся система с жёсткими паттернами поведения». Клиенты кивают, но ничего не меняется. Какую профессиональную ловушку он воспроизводит?",
    opts: [
      "Спасатель — берёт на себя ответственность за решение",
      "Союзник одного — видит ситуацию только с одной стороны",
      "Судья — встал на сторону одного из участников",
      "Эксперт — говорит на своём языке, а не на языке клиента"
    ],
    ans: 3
  },
  {
    // Q6 → а
    text: "Чем консультирование принципиально отличается от психотерапии?",
    opts: [
      "Консультирование работает с клинически здоровыми людьми в сложной жизненной ситуации; психотерапия — с глубинными внутриличностными конфликтами и серьёзными эмоциональными расстройствами",
      "Консультирование работает с группами, психотерапия — с индивидуальными клиентами",
      "Консультирование не требует профессионального образования",
      "Консультирование фокусируется на прошлом, психотерапия — на настоящем"
    ],
    ans: 0
  },

  // --- ПАРА 2 ---
  {
    // Q7 → б
    text: "Что означает характеристика постиндустриальной семьи «высокая и узкая»?",
    opts: [
      "Иерархия в семье стала более строгой",
      "В каждом поколении мало детей, но одновременно живут 3–4 поколения",
      "Семьи переехали в многоэтажные дома",
      "Одновременно выросли и требования к браку, и уровень разводов"
    ],
    ans: 1
  },
  {
    // Q8 → г
    text: "Что утверждает теорема Томаса и Томаса (1928)?",
    opts: [
      "Восприятие реальности формируется в раннем детстве и устойчиво к изменениям",
      "Поведение человека определяется его биологическими особенностями, а не социальным контекстом",
      "Конфликт в семье — следствие индивидуальных различий, а не внешних условий",
      "Если люди определяют ситуацию как реальную — она становится реальной по своим последствиям"
    ],
    ans: 3
  },
  {
    // Q9 → в
    text: "Экологическая модель Бронфенбреннера выделяет несколько уровней. Какой уровень включает политику компании-работодателя, которая влияет на семью, не вступая с ней в прямой контакт?",
    opts: [
      "Микросистема",
      "Макросистема",
      "Экзосистема",
      "Мезосистема"
    ],
    ans: 2
  },
  {
    // Q10 → а (без изменений)
    text: "Согласно модели жизненного цикла семьи Дювалль, на какой стадии перед парой стоит задача «создать концепт ‘Мы’ и отделиться от родительских семей»?",
    opts: [
      "Стадия 1 — пара без детей",
      "Стадия 2 — семья с грудным ребёнком",
      "Стадия 6 — «стартовая площадка», когда первый ребёнок покидает дом",
      "Стадия 7 — «пустое гнездо»"
    ],
    ans: 0
  },
  {
    // Q11 → б
    text: "Что такое концепт «Мы» в паре?",
    opts: [
      "Официальное оформление брака и общий бюджет",
      "Эмоциональная граница пары: общие ритуалы, внутренний язык, «наша история» и ощущение «мы — одна команда»",
      "Устойчивое ролевое распределение между партнёрами",
      "Единый родительский фронт в воспитании детей"
    ],
    ans: 1
  },
  {
    // Q12 → г
    text: "Согласно линзе теории конфликта, «принцип наименьшего интереса» (Уоллер, 1938) означает:",
    opts: [
      "Тот, кто меньше зарабатывает, имеет меньше власти",
      "Власть в семье принадлежит тому, кто контролирует финансы",
      "Тот, кто реже инициирует конфликт, меньше вовлечён в отношения",
      "Тот, кто менее заинтересован в продолжении отношений, имеет больше рычагов влияния"
    ],
    ans: 3
  },

  // --- ПАРА 3+4 ---
  {
    // Q13 → а
    text: "Ребёнок в классе никогда не просит о помощи: всё делает сам, даже когда явно не справляется. Что это может означать с точки зрения теории привязанности?",
    opts: [
      "Признак избегающей привязанности типа A — ребёнок адаптировался к холодному, предсказуемому родителю и подавляет потребность в помощи",
      "Признак надёжной привязанности типа B — ребёнок уверен в своих силах",
      "Признак тревожной привязанности типа C — ребёнок гиперактивирует контакт через поведение",
      "Признак дезорганизованной привязанности типа D — поведение непредсказуемо"
    ],
    ans: 0
  },
  {
    // Q14 → в
    text: "Циркулярная модель Олсона описывает семью по двум осям. Какие это оси?",
    opts: [
      "Открытость и коммуникация",
      "Конфликтность и поддержка",
      "Сплочённость и гибкость",
      "Иерархия и автономия"
    ],
    ans: 2
  },
  {
    // Q15 → б
    text: "По Минухину, если в семье границы между подсистемами размыты и дети несут тревогу родителей как свою — это состояние называется:",
    opts: [
      "Разобщённость (disengagement)",
      "Слияние (enmeshment)",
      "Триангуляция",
      "Гомеостаз"
    ],
    ans: 1
  },
  {
    // Q16 → г
    text: "Мюррей Боуэн описал механизм, при котором напряжение между двумя людьми становится невыносимым и система втягивает третьего — чаще всего ребёнка. Как этот механизм называется?",
    opts: [
      "Гомеостаз",
      "Дифференциация",
      "Парентификация",
      "Триангуляция"
    ],
    ans: 3
  },
  {
    // Q17 → а
    text: "Семья пришла на консультацию, говорит «мы хотим изменений», но при первых реальных переменах начинает их саботировать. Какое системное свойство это объясняет?",
    opts: [
      "Гомеостаз — система стремится сохранить привычное состояние, даже если оно дисфункционально",
      "Триангуляция — система втягивает третьего, чтобы снять напряжение",
      "Слияние — границы между подсистемами стёрты",
      "Парентификация — ребёнок берёт на себя функцию стабилизации"
    ],
    ans: 0
  },
  {
    // Q18 → в
    text: "Парентификация — это:",
    opts: [
      "Воспитательный стиль, при котором родители относятся к ребёнку как к маленькому взрослому",
      "Чрезмерный контроль родителей над ребёнком",
      "Ситуация, когда ребёнок берёт на себя задачу регулировать эмоциональное состояние родителя",
      "Передача дисфункциональных паттернов от родителей к детям"
    ],
    ans: 2
  },

  // --- ПАРА 5 ---

const TOTAL = QUESTIONS.length; // 30

// Grading thresholds (out of 30)
// 5: 25–30, 4: 20–24, 3: 15–19, fail: ≤14
function getGrade(score) {
  if (score >= 25) return 5;
  if (score >= 20) return 4;
  if (score >= 15) return 3;
  return 0;
}

let student = {};
let answers = new Array(TOTAL).fill(null);
let current = 0;

function startExam() {
  const name = document.getElementById('reg-name').value.trim();
  const group = document.getElementById('reg-group').value.trim();
  const email = document.getElementById('reg-email').value.trim();

  if (!name || !group || !email) {
    alert('Пожалуйста, заполните все поля.');
    return;
  }
  if (!email.includes('@')) {
    alert('Введите корректный email.');
    return;
  }

  student = { name, group, email };
  document.getElementById('screen-reg').classList.add('hidden');
  document.getElementById('screen-q').classList.remove('hidden');
  renderQ(0);
}

function renderQ(idx) {
  current = idx;
  const q = QUESTIONS[idx];

  document.getElementById('q-num').textContent = 'Вопрос ' + (idx + 1);
  document.getElementById('q-counter').textContent = 'Вопрос ' + (idx + 1) + ' из ' + TOTAL;
  document.getElementById('q-text').textContent = q.text;

  const pct = ((idx + 1) / TOTAL * 100).toFixed(1);
  document.getElementById('progress-fill').style.width = pct + '%';

  // Options
  const container = document.getElementById('q-options');
  container.innerHTML = '';
  const letters = ['а', 'б', 'в', 'г'];
  q.opts.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option' + (answers[idx] === i ? ' selected' : '');
    div.innerHTML = `<div class="option-letter">${letters[i]}</div><div class="option-text">${opt}</div>`;
    div.addEventListener('click', () => selectAnswer(idx, i));
    container.appendChild(div);
  });

  // Nav buttons
  document.getElementById('btn-prev').style.visibility = idx === 0 ? 'hidden' : 'visible';
  const btnNext = document.getElementById('btn-next');
  btnNext.disabled = answers[idx] === null;
  btnNext.textContent = idx === TOTAL - 1 ? 'Завершить тест →' : 'Далее →';
}

function selectAnswer(qIdx, optIdx) {
  answers[qIdx] = optIdx;
  document.querySelectorAll('.option').forEach((el, i) => {
    el.classList.toggle('selected', i === optIdx);
  });
  document.getElementById('btn-next').disabled = false;
}

function prevQ() {
  if (current > 0) renderQ(current - 1);
}

function nextQ() {
  if (current < TOTAL - 1) {
    renderQ(current + 1);
  } else {
    showResults();
  }
}

function showResults() {
  document.getElementById('screen-q').classList.add('hidden');
  document.getElementById('screen-result').classList.remove('hidden');

  const score = answers.reduce((acc, a, i) => acc + (a === QUESTIONS[i].ans ? 1 : 0), 0);
  const grade = getGrade(score);
  const pct = (score / TOTAL * 100).toFixed(0);

  // Greeting
  document.getElementById('result-greeting').innerHTML =
    'Уважаемый(-ая) <strong>' + student.name + '</strong>, ваш результат:';

  // Grade display
  const circle = document.getElementById('grade-circle');
  const gradeLabels = { 5: 'Отлично', 4: 'Хорошо', 3: 'Удовлетворительно', 0: 'Не зачтено' };
  const gradeSubs = {
    5: 'Поздравляем — отличный результат!',
    4: 'Хороший результат!',
    3: 'Зачёт получен.',
    0: 'Недостаточно баллов для зачёта.'
  };
  const gradeClasses = { 5: 'grade-5', 4: 'grade-4', 3: 'grade-3', 0: 'grade-fail' };

  circle.textContent = grade === 0 ? '2' : grade;
  circle.className = 'grade-circle ' + gradeClasses[grade];
  document.getElementById('grade-label').textContent = gradeLabels[grade];
  document.getElementById('grade-sub').textContent = gradeSubs[grade];
  document.getElementById('score-text-right').textContent = score + ' / ' + TOTAL;

  const bar = document.getElementById('score-bar-fill');
  const barColor = grade === 5 ? '#10b981' : grade === 4 ? '#6366f1' : grade === 3 ? '#f59e0b' : '#ef4444';
  bar.style.background = barColor;
  setTimeout(() => { bar.style.width = pct + '%'; }, 100);

  // Build answer chart
  const grid = document.getElementById('chart-grid');
  grid.innerHTML = '';
  answers.forEach((a, i) => {
    const correct = a === QUESTIONS[i].ans;
    const cell = document.createElement('div');
    cell.className = 'chart-cell ' + (correct ? 'correct' : 'wrong');
    cell.textContent = i + 1;
    cell.title = (correct ? '✓ ' : '✗ ') + 'Вопрос ' + (i + 1);
    grid.appendChild(cell);
  });

  submitResults(score, grade);
}

function submitResults(score, grade) {
  const msg = document.getElementById('sending-msg');
  const gradeDisplay = grade === 0 ? '2 (не зачтено)' : grade;

  const pairLabels = [
    'Пара 1','Пара 1','Пара 1','Пара 1','Пара 1','Пара 1',
    'Пара 2','Пара 2','Пара 2','Пара 2','Пара 2','Пара 2',
    'Пара 3-4','Пара 3-4','Пара 3-4','Пара 3-4','Пара 3-4','Пара 3-4',
    'Пара 5','Пара 5','Пара 5','Пара 5','Пара 5','Пара 5',
    'Пара 7','Пара 7','Пара 7','Пара 7','Пара 7','Пара 7'
  ];

  // Detailed breakdown — one line per question
  const lines = QUESTIONS.map((q, i) => {
    const ok = answers[i] === q.ans;
    const letters = ['а','б','в','г'];
    const chosenLetter = answers[i] !== null ? letters[answers[i]] : '—';
    const chosenText  = answers[i] !== null ? q.opts[answers[i]] : 'не отвечено';
    const correctLetter = letters[q.ans];
    const correctText   = q.opts[q.ans];
    const status = ok ? '✓ верно' : '✗ ошибка';
    if (ok) {
      return `В${i+1} [${pairLabels[i]}] ${status} | ответ: ${chosenLetter}) ${chosenText}`;
    } else {
      return `В${i+1} [${pairLabels[i]}] ${status} | ответ студента: ${chosenLetter}) ${chosenText} | правильно: ${correctLetter}) ${correctText}`;
    }
  }).join('\n');

  const wrongCount = score < TOTAL ? (TOTAL - score) : 0;
  const body =
    `Студент: ${student.name}\n` +
    `Группа: ${student.group}\n` +
    `Email: ${student.email}\n` +
    `Результат: ${score} из ${TOTAL} (${Math.round(score/TOTAL*100)}%)\n` +
    `Оценка: ${gradeDisplay}\n` +
    `Ошибок: ${wrongCount}\n` +
    `\n--- ДЕТАЛИЗАЦИЯ ОТВЕТОВ ---\n` +
    lines;

  const formData = new FormData();
  formData.append('Студент', student.name);
  formData.append('Группа', student.group);
  formData.append('Email студента', student.email);
  formData.append('Результат', score + ' из ' + TOTAL + ' (' + Math.round(score/TOTAL*100) + '%)');
  formData.append('Оценка', gradeDisplay);
  formData.append('Ошибок', wrongCount);
  formData.append('Детализация', lines);
  formData.append('_subject', '[Экзамен] ' + student.name + ' — оценка ' + gradeDisplay + ' (' + score + '/' + TOTAL + ')');
  formData.append('_template', 'table');
  formData.append('_captcha', 'false');

  fetch('https://formsubmit.co/ekolesnikov91@gmail.com', {
    method: 'POST',
    body: formData
  })
  .then(r => {
    if (r.ok) {
      msg.innerHTML = '<span class="sent-ok">✓ Результаты отправлены преподавателю</span>';
    } else {
      throw new Error('server error');
    }
  })
  .catch(() => {
    msg.innerHTML = '<span class="sent-err">Не удалось отправить автоматически. Сообщите преподавателю: ' + score + '/' + TOTAL + ', оценка ' + gradeDisplay + '</span>';
  });
}
